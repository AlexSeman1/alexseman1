<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEBE1; --surface:#F8F5ED; --ink:#26241F; --ink-soft:#7A7364;
    --line:#DAD3C0; --teal:#2F6F62; --gold:#A9772E; --rust:#A6432E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding:32px 20px 60px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:34px;margin:0 0 4px;letter-spacing:-0.01em;}
  .date{color:var(--ink-soft);margin:0 0 28px;font-size:14px;}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .tab-btn{background:none;border:none;font-size:15px;padding:8px 0;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-right:28px;cursor:pointer;font-family:'Inter',sans-serif;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500;}
  .panel{display:none;} .panel.active{display:block;}
  .row{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);}
  input,select{font-family:'Inter',sans-serif;background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:6px 2px;font-size:15px;color:var(--ink);outline:none;}
  input:focus,select:focus{border-bottom-color:var(--ink);}
  input::placeholder{color:var(--ink-soft);}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .ghost-btn{background:none;border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-size:14px;color:var(--ink);}
  .ghost-btn:hover{border-color:var(--ink);}
  .x-btn{background:none;border:none;color:var(--ink-soft);font-size:18px;line-height:1;padding:4px 6px;}
  .x-btn:hover{color:var(--rust);}
  .add-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center;}
  .empty{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
  .day-box{width:28px;height:28px;border-radius:4px;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .day-box.done{background:var(--teal);color:#F8F5ED;}
  .day-box.today{border-color:var(--teal);}
  .streak{font-size:12px;color:var(--teal);margin-left:10px;}
  .bar-bg{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);}
  .totals{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;}
  .totals .label{font-size:12px;color:var(--ink-soft);}
  .totals .value{font-family:'Fraunces',serif;font-size:24px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>The Ledger</h1>
  <p class="date" id="todayLabel"></p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="habits">Habits</button>
    <button class="tab-btn" data-tab="goals">Goals</button>
    <button class="tab-btn" data-tab="finances">Finances</button>
  </div>

  <div class="panel active" id="panel-habits">
    <div id="habitsList"></div>
    <div class="add-row">
      <input id="newHabit" placeholder="Add a habit — e.g. Drink water" style="flex:1;">
      <button class="ghost-btn" onclick="addHabit()">Add</button>
    </div>
  </div>

  <div class="panel" id="panel-goals">
    <div id="goalsList"></div>
    <div class="add-row">
      <input id="newGoalName" placeholder="Add a goal — e.g. Run a 5k" style="flex:2;min-width:180px;">
      <input id="newGoalDate" type="date" style="flex:1;min-width:140px;">
      <button class="ghost-btn" onclick="addGoal()">Add</button>
    </div>
  </div>

  <div class="panel" id="panel-finances">
    <div class="totals">
      <div><div class="label">Balance</div><div class="value" id="balanceVal">$0.00</div></div>
      <div><div class="label" id="monthInLabel">This month in</div><div class="value" style="color:var(--teal)" id="monthInVal">$0.00</div></div>
      <div><div class="label" id="monthOutLabel">This month out</div><div class="value" style="color:var(--rust)" id="monthOutVal">$0.00</div></div>
    </div>
    <div class="add-row">
      <input id="txDate" type="date" style="width:140px;">
      <input id="txCategory" placeholder="Category — e.g. Groceries" style="flex:1;min-width:140px;">
      <input id="txAmount" type="number" step="0.01" placeholder="Amount" style="width:100px;">
      <select id="txType">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <button class="ghost-btn" onclick="addTx()">Add</button>
    </div>
    <div id="txList" style="margin-top:24px;"></div>
  </div>
</div>

<script>
// ---------- storage (plain localStorage — works on any static host) ----------
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

let habitsData = load('habitsData', {habits:[], completions:{}});
let goalsData = load('goalsData', {goals:[]});
let financeData = load('financeData', {transactions:[]});

// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);
function fmtMoney(n){ return (n<0?'-$':'$') + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateShort(d){ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function dayLetter(d){ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'narrow'}); }
function last7Dates(){
  const out=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(d.toISOString().slice(0,10)); }
  return out;
}
function computeStreak(habitId){
  let streak=0; let d=new Date();
  while(true){
    const key=d.toISOString().slice(0,10);
    if(habitsData.completions[key] && habitsData.completions[key][habitId]){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

document.getElementById('todayLabel').textContent =
  new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

// ---------- habits ----------
function addHabit(){
  const input = document.getElementById('newHabit');
  const name = input.value.trim();
  if(!name) return;
  habitsData.habits.push({id:uid(), name});
  input.value='';
  save('habitsData', habitsData);
  renderHabits();
}
function removeHabit(id){
  habitsData.habits = habitsData.habits.filter(h=>h.id!==id);
  save('habitsData', habitsData);
  renderHabits();
}
function toggleHabit(id, date){
  if(!habitsData.completions[date]) habitsData.completions[date]={};
  habitsData.completions[date][id] = !habitsData.completions[date][id];
  save('habitsData', habitsData);
  renderHabits();
}
function renderHabits(){
  const list = document.getElementById('habitsList');
  const today = todayStr();
  const week = last7Dates();
  if(habitsData.habits.length===0){
    list.innerHTML = '<p class="empty">No habits yet. Add the first one below — something small you\\'ll actually do today.</p>';
    return;
  }
  list.innerHTML = habitsData.habits.map(h=>{
    const streak = computeStreak(h.id);
    const days = week.map(d=>{
      const done = !!(habitsData.completions[d] && habitsData.completions[d][h.id]);
      const isToday = d===today;
      return `<button class="day-box ${done?'done':''} ${isToday?'today':''}" title="${fmtDateShort(d)}" onclick="toggleHabit('${h.id}','${d}')">${dayLetter(d)}</button>`;
    }).join('');
    return `<div class="row" style="align-items:flex-start;">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:15px;">${h.name}</span>
          ${streak>0?`<span class="streak">${streak} day streak</span>`:''}
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;">${days}</div>
      </div>
      <button class="x-btn" onclick="removeHabit('${h.id}')">×</button>
    </div>`;
  }).join('');
}

// ---------- goals ----------
function addGoal(){
  const nameInput = document.getElementById('newGoalName');
  const dateInput = document.getElementById('newGoalDate');
  const name = nameInput.value.trim();
  if(!name) return;
  goalsData.goals.push({id:uid(), name, targetDate:dateInput.value, progress:0});
  nameInput.value=''; dateInput.value='';
  save('goalsData', goalsData);
  renderGoals();
}
function removeGoal(id){
  goalsData.goals = goalsData.goals.filter(g=>g.id!==id);
  save('goalsData', goalsData);
  renderGoals();
}
function setProgress(id, val){
  const g = goalsData.goals.find(g=>g.id===id);
  if(g){ g.progress = parseInt(val); save('goalsData', goalsData); renderGoals(); }
}
function renderGoals(){
  const list = document.getElementById('goalsList');
  if(goalsData.goals.length===0){
    list.innerHTML = '<p class="empty">No goals yet. Add one below and drag the slider as you make progress.</p>';
    return;
  }
  list.innerHTML = goalsData.goals.map(g=>`
    <div class="row" style="align-items:flex-start;">
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:15px;">${g.name}</span>
          <span style="font-size:13px;color:var(--ink-soft);">${g.targetDate?('by '+fmtDateShort(g.targetDate)):''}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
          <div class="bar-bg"><div class="bar-fill" style="width:${g.progress}%;"></div></div>
          <input type="range" min="0" max="100" value="${g.progress}" style="width:100px;border:none;" oninput="setProgress('${g.id}', this.value)">
          <span style="font-size:13px;color:var(--ink-soft);width:32px;">${g.progress}%</span>
        </div>
      </div>
      <button class="x-btn" onclick="removeGoal('${g.id}')">×</button>
    </div>`).join('');
}

// ---------- finances ----------
document.getElementById('txDate').value = todayStr();
function addTx(){
  const date = document.getElementById('txDate').value || todayStr();
  const categoryInput = document.getElementById('txCategory');
  const amountInput = document.getElementById('txAmount');
  const type = document.getElementById('txType').value;
  const category = categoryInput.value.trim();
  const amount = parseFloat(amountInput.value);
  if(!category || isNaN(amount) || amount<=0) return;
  financeData.transactions.unshift({id:uid(), date, category, amount, type});
  categoryInput.value=''; amountInput.value='';
  save('financeData', financeData);
  renderFinances();
}
function removeTx(id){
  financeData.transactions = financeData.transactions.filter(t=>t.id!==id);
  save('financeData', financeData);
  renderFinances();
}
function renderFinances(){
  const sorted = [...financeData.transactions].sort((a,b)=> a.date<b.date?1:-1);
  let income=0, expense=0;
  const ym = todayStr().slice(0,7);
  let monthIn=0, monthOut=0;
  financeData.transactions.forEach(t=>{
    if(t.type==='income') income+=t.amount; else expense+=t.amount;
    if(t.date.slice(0,7)===ym){ if(t.type==='income') monthIn+=t.amount; else monthOut+=t.amount; }
  });
  document.getElementById('balanceVal').textContent = fmtMoney(income-expense);
  document.getElementById('monthInVal').textContent = fmtMoney(monthIn);
  document.getElementById('monthOutVal').textContent = fmtMoney(monthOut);
  const monthName = new Date().toLocaleDateString(undefined,{month:'long'});
  document.getElementById('monthInLabel').textContent = monthName + ' in';
  document.getElementById('monthOutLabel').textContent = monthName + ' out';

  const list = document.getElementById('txList');
  if(sorted.length===0){
    list.innerHTML = '<p class="empty">No transactions logged yet.</p>';
    return;
  }
  list.innerHTML = sorted.map(t=>`
    <div class="row">
      <div style="display:flex;gap:16px;align-items:baseline;flex:1;">
        <span style="font-size:13px;color:var(--ink-soft);width:60px;">${fmtDateShort(t.date)}</span>
        <span style="font-size:15px;">${t.category}</span>
      </div>
      <span style="font-size:15px;color:${t.type==='income'?'var(--teal)':'var(--rust)'};margin-right:14px;">
        ${t.type==='income'?'+':'-'}${fmtMoney(t.amount)}
      </span>
      <button class="x-btn" onclick="removeTx('${t.id}')">×</button>
    </div>`).join('');
}

// enter-to-add
document.getElementById('newHabit').addEventListener('keydown', e=>{ if(e.key==='Enter') addHabit(); });

// initial render
renderHabits();
renderGoals();
renderFinances();
</script>
</body>
</html>
